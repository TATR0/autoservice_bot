# ─────────────────────────────────────────────────────────────────────────────
# Локальная разработка и self-hosted деплой.
# База — своя, в соседнем контейнере: данные автосервисов и телефоны клиентов
# лежат на вашем сервере и никуда больше не ходят.
#
# Запуск локально:
#   cp .env.example .env   # заполнить переменные
#   docker compose up --build
#
# Выкат на VPS — одной командой, она добавит HTTPS через Caddy:
#   ./scripts/deploy.sh
#
# Для локальной отладки вебхука нужен публичный HTTPS-адрес:
#   ngrok http 8080  →  подставить URL в BASE_URL
# ─────────────────────────────────────────────────────────────────────────────

services:

  # База. Наружу не публикуется совсем: к ней ходят только контейнеры проекта,
  # поэтому пароль не защищает её от интернета — интернета она не видит.
  db:
    image: postgres:17-alpine
    container_name: autoservice_db
    restart: unless-stopped
    # 127.0.0.1, а не 0.0.0.0: порт видит только сама машина и тот, кто пришёл
    # на неё по SSH — этого хватает pgAdmin через туннель. Без адреса впереди
    # docker открыл бы базу всему интернету в обход ufw
    ports:
      - "127.0.0.1:${DB_LOCAL_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoservice}
      POSTGRES_USER: ${POSTGRES_USER:-autoservice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?не задан — заполните .env, проще всего ./scripts/init_env.sh}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Схема применяется сама при создании пустой базы. На последующих
      # выкатах её же прогоняет deploy.sh: schema.sql идемпотентный
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoservice} -d ${POSTGRES_DB:-autoservice}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      target: runtime
    container_name: autoservice_bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Только localhost: наружу приложение смотрит через Caddy, а этот адрес
    # остаётся для curl с самой машины, когда надо понять, кто именно молчит
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Снимок базы раз в сутки. Отдельным сервисом, а не задачей в системе:
  # бэкап, который надо не забыть настроить руками, однажды не настроят.
  # Тег образа — не ниже версии сервера: pg_dump старше базы дампить откажется.
  backup:
    image: postgres:17-alpine
    container_name: autoservice_backup
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - ./scripts/backup_db.sh:/usr/local/bin/backup_db.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup_db.sh", "--loop"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Вывоз копий с машины. Снимки сервиса backup лежат на том же диске, что и
  # база: пропавший сервер унесёт их вместе с ней. Здесь они уезжают туда,
  # куда указывает BACKUP_REMOTE. Пусто — контейнер спит и ничего не делает:
  # учётные данные чужого хранилища завести за владельца нельзя.
  offsite:
    image: rclone/rclone:1
    container_name: autoservice_offsite
    restart: unless-stopped
    env_file: .env
    volumes:
      # Только на чтение: вывоз не должен уметь испортить то, что вывозит
      - ./backups:/backups:ro
      # Каталог, а не файл: отсутствующий файл docker подменил бы каталогом,
      # и вместо понятного «нет настроек rclone» вышла бы невнятная ошибка
      - ./secrets:/config/rclone:ro
      - ./scripts/backup_offsite.sh:/usr/local/bin/backup_offsite.sh:ro
      # Когда вывоз удался в последний раз. В томе, а не в контейнере:
      # перезапуск не должен сбрасывать отсчёт молчания и слать письмо заново
      - offsite_state:/state
    entrypoint: ["/bin/sh", "/usr/local/bin/backup_offsite.sh", "--loop"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Данные базы. Живут отдельно от контейнеров: docker compose down их не
  # трогает. Удаляет только явное docker compose down -v
  pgdata:
  # Отметки вывоза копий: когда удалось в последний раз и звали ли владельца
  offsite_state:
