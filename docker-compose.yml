# ─────────────────────────────────────────────────────────────────────────────
# Локальная разработка и self-hosted деплой.
# БД — Supabase (внешняя), локального postgres нет.
#
# Запуск локально:
#   cp .env.example .env   # заполнить переменные
#   docker compose up --build
#
# Выкат на VPS — одной командой, она добавит HTTPS через Caddy:
#   ./scripts/deploy.sh
#
# Для локальной отладки вебхука нужен публичный HTTPS-адрес:
#   ngrok http 8080  →  подставить URL в BASE_URL
# ─────────────────────────────────────────────────────────────────────────────

services:

  app:
    build:
      context: .
      target: runtime
    container_name: autoservice_bot
    restart: unless-stopped
    env_file: .env
    # Только localhost: наружу приложение смотрит через Caddy, а этот адрес
    # остаётся для curl с самой машины, когда надо понять, кто именно молчит
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Снимок базы раз в сутки. Отдельным сервисом, а не задачей в системе:
  # бэкап, который надо не забыть настроить руками, однажды не настроят.
  # Тег образа — не ниже версии сервера: pg_dump старше базы дампить откажется.
  backup:
    image: postgres:17-alpine
    container_name: autoservice_backup
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backups:/backups
      - ./scripts/backup_db.sh:/usr/local/bin/backup_db.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup_db.sh", "--loop"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
